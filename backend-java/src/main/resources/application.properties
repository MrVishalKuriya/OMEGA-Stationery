# ===================================================================
# OMEGA Stationery & Books - Java Spring Boot Backend Configuration
# ===================================================================

# Application Info
spring.application.name=omega-stationery-backend

# Server Configuration
# Render and Cloud hosts inject the PORT environment variable dynamically
server.port=${PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ===================================================================
# MongoDB Connection
# Set MONGODB_URI in Render dashboard to your MongoDB Atlas connection string:
# mongodb+srv://<username>:<password>@cluster0.abcde.mongodb.net/omega_stationery?retryWrites=true&w=majority
# ===================================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://indigoprinteromega07_db_user:OMEGA%407016@omega.ccgcbcy.mongodb.net/omega_stationery?retryWrites=true&w=majority}
spring.data.mongodb.auto-index-creation=true

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Spring Boot Actuator Endpoints (for Render health check / diagnostics)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# CORS Configuration
# Comma-separated allowed frontend origins or * for open CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.onrender.com,https://*.vercel.app,*}

# Logging Configuration
logging.level.root=INFO
logging.level.com.omega.stationery=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===================================================================
# MongoDB AI Model API Configuration
# ===================================================================
mongodb.ai.endpoint=${MONGODB_AI_ENDPOINT:https://ai.mongodb.com}
mongodb.ai.api-key=${MONGODB_AI_API_KEY:al-VPCnW0f05wrvNC9EBX63MS0V2E8Fmv4WqN78ueb53U8}

