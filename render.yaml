services:
  # ===================================================================
  # 1. Java Spring Boot + MongoDB API Web Service
  # ===================================================================
  - type: web
    name: omega-stationery-backend
    runtime: docker
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    plan: free
    region: frankfurt # or oregon / singapore
    envVars:
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        value: mongodb+srv://indigoprinteromega07_db_user:OMEGA%407016@omega.ccgcbcy.mongodb.net/omega_stationery?retryWrites=true&w=majority
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/health
    autoDeploy: true

  # ===================================================================
  # 2. Vite React Frontend (Static Site or Web Service)
  # ===================================================================
  - type: web
    name: omega-stationery-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: omega-stationery-backend
          property: host
