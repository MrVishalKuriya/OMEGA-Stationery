services:
  # ===================================================================
  # 1. High-Performance Node.js + MongoDB API Web Service
  # ===================================================================
  - type: web
    name: omega-stationery-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.mjs
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        value: mongodb+srv://indigoprinteromega07_db_user:OMEGA%407016@omega.ccgcbcy.mongodb.net/omega_stationery?retryWrites=true&w=majority
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MONGODB_AI_ENDPOINT
        value: https://ai.mongodb.com
      - key: MONGODB_AI_API_KEY
        value: al-VPCnW0f05wrvNC9EBX63MS0V2E8Fmv4WqN78ueb53U8
    healthCheckPath: /api/health
    autoDeploy: true

  # ===================================================================
  # 2. Vite React Frontend (Static Web Site)
  # ===================================================================
  - type: web
    name: omega-stationery-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: omega-stationery-backend
          property: host
